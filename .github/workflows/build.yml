name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Checkout yenta dependency
        uses: actions/checkout@v4
        with:
          repository: piotrhoppe/yenta
          ref: a962a8bf57d305dd436ab1c1d8a01f47e35a9ad7
          path: yenta
          fetch-depth: 0

      - name: Build yenta dependency
        run: |
            cd yenta
            mvn -B --no-transfer-progress -DskipTests clean install

      - name: Build with Maven
        run: mvn -B --no-transfer-progress -DskipTests clean install

      - name: Upload NBM artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nbm-packages
          path: 'target/nbms/*.nbm'
          retention-days: 30
